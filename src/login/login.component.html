<div class="tela-login">
  <div class="container-login">
    <h1 class="titulo-viceri">Viceri-SEIDOR</h1>

    <form [formGroup]="formLogin" (ngSubmit)="onLogin()" class="formulario">
      <h2>Entrar</h2>

      <input type="email" formControlName="email" placeholder="E-mail" />
      <input type="password" formControlName="senha" placeholder="Senha" />

      <button type="submit">Entrar</button>
    </form>

    <p class="cadastro">
      Não tem conta?
      <a routerLink="/cadastro">Cadastre-se</a>
    </p>
  </div>
</div>
