<div class="tela-login">
    <div class="container-login">
        <h1 class="titulo-viceri">Viceri-SEIDOR</h1>

        <div class="formulario">
            <h2>Cadastro</h2>

            <form [formGroup]="formCadastro" (ngSubmit)="onRegister()">
                <div class="input-group">
                    <input type="text" formControlName="nome" placeholder="Nome" />
                    <div *ngIf="formCadastro.get('nome')?.touched && formCadastro.get('nome')?.invalid" class="error">
                        <small>Nome é obrigatório.</small>
                    </div>
                </div>

                <div class="input-group">
                    <input type="email" formControlName="email" placeholder="Email" />
                    <div *ngIf="formCadastro.get('email')?.touched && formCadastro.get('email')?.invalid" class="error">
                        <small *ngIf="formCadastro.get('email')?.errors?.['required']">E-mail é obrigatório.</small>
                        <small *ngIf="formCadastro.get('email')?.errors?.['email']">Formato de e-mail inválido.</small>
                    </div>
                </div>

                <div class="input-group">
                    <input type="password" formControlName="senha" placeholder="Senha" />
                    <div *ngIf="formCadastro.get('senha')?.touched && formCadastro.get('senha')?.invalid" class="error">
                        <small>Senha é obrigatória.</small>
                    </div>
                </div>

                <button type="submit" [disabled]="formCadastro.invalid">Registrar</button>
            </form>

            <div class="cadastro">
                Já tem uma conta? <a (click)="voltarLogin()">Faça login</a>
            </div>
        </div>
    </div>
</div>
